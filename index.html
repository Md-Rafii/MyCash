<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>সাজসজ্জা কসমেটিকস এন্ড পেপার হাউস — Smart Khata POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Baloo+Da+2:wght@600;700;800&display=swap" rel="stylesheet">
<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --sky:#0EA5E9;
  --sky-dark:#0284C7;
  --sky-light:#E6F6FE;
  --sky-lighter:#F3FAFE;
  --white:#FFFFFF;
  --text:#1E293B;
  --text-soft:#64748B;
  --success:#16A34A;
  --success-bg:#E9F9EF;
  --warning:#F59E0B;
  --warning-bg:#FFF6E5;
  --error:#EF4444;
  --error-bg:#FEECEC;
  --border:#E3EEF6;
  --shadow: 0 2px 10px rgba(14,165,233,0.08), 0 1px 2px rgba(14,165,233,0.06);
  --shadow-lg: 0 8px 30px rgba(14,165,233,0.14);
  --radius: 16px;
  --radius-sm: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Hind Siliguri',sans-serif;
  background:var(--sky-lighter);
  color:var(--text);
  -webkit-tap-highlight-color:transparent;
}
.app-shell{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--sky-lighter);
  position:relative;
  padding-bottom:78px;
}
.hide{display:none !important;}
.brand-font{font-family:'Baloo Da 2',sans-serif;}
::-webkit-scrollbar{width:0;height:0;}

/* Header */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(135deg,var(--sky) 0%, var(--sky-dark) 100%);
  color:#fff;
  padding:16px 16px 20px;
  border-radius:0 0 22px 22px;
  box-shadow:var(--shadow-lg);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;}
.shop-info .shop-name{font-family:'Baloo Da 2',sans-serif;font-size:17px;font-weight:700;letter-spacing:.2px;line-height:1.25;}
.shop-info .shop-tag{font-size:11.5px;opacity:.85;margin-top:2px;}
.top-actions{display:flex;gap:10px;flex-shrink:0;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  background:rgba(255,255,255,0.18);
  display:flex;align-items:center;justify-content:center;
  border:none;color:#fff;position:relative;cursor:pointer;
}
.icon-btn svg{width:19px;height:19px;}
.badge-dot{
  position:absolute;top:-3px;right:-3px;
  background:var(--error);color:#fff;font-size:10px;font-weight:700;
  min-width:16px;height:16px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;padding:0 3px;
  border:2px solid var(--sky-dark);
}
.header-search{margin-top:14px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.92);border-radius:12px;padding:9px 12px;}
.header-search input{border:none;outline:none;background:transparent;flex:1;font-family:inherit;font-size:14px;color:var(--text);}
.header-search svg{width:16px;height:16px;color:var(--sky-dark);flex-shrink:0;}

/* Page title bar for sub-pages */
.page-header{
  display:flex;align-items:center;gap:10px;
  padding:16px 16px 6px;
}
.page-header h1{font-family:'Baloo Da 2',sans-serif;font-size:18px;margin:0;flex:1;}
.back-btn{width:34px;height:34px;border-radius:10px;background:var(--white);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);}
.back-btn svg{width:17px;height:17px;color:var(--sky-dark);}

.content{padding:14px 16px 20px;}

/* Cards */
.card{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  border:1px solid var(--border);
}
.section-title{font-family:'Baloo Da 2',sans-serif;font-size:15px;font-weight:700;margin:18px 2px 10px;display:flex;align-items:center;justify-content:space-between;}
.section-title span.link{font-size:12.5px;color:var(--sky-dark);font-weight:500;font-family:'Hind Siliguri',sans-serif;cursor:pointer;}

/* Dashboard stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.stat-card{
  background:var(--white);border-radius:14px;padding:13px 14px;
  box-shadow:var(--shadow);border:1px solid var(--border);
  position:relative;overflow:hidden;
}
.stat-card .stat-icon{
  width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;
}
.stat-icon svg{width:16px;height:16px;}
.stat-label{font-size:11.5px;color:var(--text-soft);font-weight:500;}
.stat-value{font-size:17px;font-weight:700;margin-top:2px;font-family:'Baloo Da 2',sans-serif;}
.stat-blue .stat-icon{background:var(--sky-light);color:var(--sky-dark);}
.stat-green .stat-icon{background:var(--success-bg);color:var(--success);}
.stat-orange .stat-icon{background:var(--warning-bg);color:var(--warning);}
.stat-red .stat-icon{background:var(--error-bg);color:var(--error);}

.chart-wrap{margin-top:8px;}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;}
.bar{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--sky) 0%, var(--sky-dark) 100%);}
.bar-day{font-size:10.5px;color:var(--text-soft);}

.low-stock-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.low-stock-item:last-child{border-bottom:none;}
.ls-icon{width:36px;height:36px;border-radius:10px;background:var(--error-bg);color:var(--error);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ls-icon svg{width:17px;height:17px;}
.ls-name{font-size:13.5px;font-weight:600;}
.ls-sub{font-size:11.5px;color:var(--text-soft);}
.ls-badge{margin-left:auto;background:var(--error-bg);color:var(--error);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}

/* Buttons */
.btn{
  border:none;border-radius:12px;font-family:inherit;font-weight:600;font-size:14px;
  padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn svg{width:16px;height:16px;}
.btn-primary{background:linear-gradient(135deg,var(--sky) 0%,var(--sky-dark) 100%);color:#fff;box-shadow:0 4px 14px rgba(14,165,233,0.35);}
.btn-outline{background:var(--white);color:var(--sky-dark);border:1.5px solid var(--sky);}
.btn-success{background:var(--success);color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:12.5px;border-radius:9px;}
.btn-ghost{background:var(--sky-light);color:var(--sky-dark);}
.btn:disabled{opacity:.6;pointer-events:none;}

/* Bottom nav */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;background:var(--white);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -4px 20px rgba(14,165,233,0.10);
  z-index:30;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-soft);background:none;border:none;font-family:inherit;font-size:10.5px;padding:4px 8px;cursor:pointer;border-radius:10px;}
.nav-item svg{width:20px;height:20px;}
.nav-item.active{color:var(--sky-dark);font-weight:600;}
.nav-item.pos-main{position:relative;top:-16px;}
.nav-item.pos-main .fab{
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--sky) 0%,var(--sky-dark) 100%);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(14,165,233,0.45);border:4px solid var(--white);
}
.nav-item.pos-main .fab svg{width:22px;height:22px;color:#fff;}

/* Forms */
.field{margin-bottom:13px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-soft);margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;border:1.5px solid var(--border);border-radius:11px;padding:11px 12px;
  font-family:inherit;font-size:14px;color:var(--text);background:var(--white);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sky);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

/* Modal / sheet */
.overlay{
  position:fixed;inset:0;background:rgba(15,40,60,0.45);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.overlay.center{align-items:center;padding:20px;}
.sheet{
  background:var(--white);width:100%;max-width:480px;border-radius:22px 22px 0 0;
  max-height:88vh;overflow-y:auto;padding:18px 16px 24px;
  animation:slideup .22s ease;
}
.overlay.center .sheet{border-radius:20px;max-height:85vh;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 14px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-head h3{font-family:'Baloo Da 2',sans-serif;font-size:16.5px;margin:0;}
.close-x{width:30px;height:30px;border-radius:9px;background:var(--sky-light);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--sky-dark);}
.close-x svg{width:15px;height:15px;}

/* Tabs / chips */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;}
.chip{
  padding:8px 14px;border-radius:20px;background:var(--white);border:1.5px solid var(--border);
  font-size:12.5px;font-weight:600;color:var(--text-soft);white-space:nowrap;cursor:pointer;flex-shrink:0;
}
.chip.active{background:var(--sky);border-color:var(--sky);color:#fff;}

/* Product grid (POS) */
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.product-card{background:var(--white);border-radius:14px;padding:12px;border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;}
.product-card .p-icon{width:100%;height:56px;border-radius:10px;background:var(--sky-light);display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--sky-dark);font-size:22px;}
.product-card .p-name{font-size:13px;font-weight:600;line-height:1.3;min-height:34px;}
.product-card .p-stock{font-size:10.5px;color:var(--text-soft);margin-top:2px;}
.product-card .p-price{font-size:14px;font-weight:700;color:var(--sky-dark);margin-top:6px;font-family:'Baloo Da 2',sans-serif;}
.product-card.out{opacity:.45;pointer-events:none;}

/* Cart */
.cart-bar{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  width:100%;max-width:480px;padding:0 16px;z-index:25;
}
.cart-bar-inner{
  background:linear-gradient(135deg,var(--sky) 0%,var(--sky-dark) 100%);color:#fff;
  border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 8px 24px rgba(14,165,233,0.4);cursor:pointer;
}
.cart-line-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.cart-line-item:last-child{border-bottom:none;}
.cli-info{flex:1;}
.cli-name{font-size:13.5px;font-weight:600;}
.cli-price{font-size:11.5px;color:var(--text-soft);}
.qty-ctrl{display:flex;align-items:center;gap:8px;background:var(--sky-light);border-radius:10px;padding:4px;}
.qty-ctrl button{width:24px;height:24px;border-radius:7px;border:none;background:var(--white);color:var(--sky-dark);font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-ctrl span{min-width:18px;text-align:center;font-weight:700;font-size:13px;}
.cli-total{font-size:13.5px;font-weight:700;min-width:64px;text-align:right;}
.cli-remove{color:var(--error);background:none;border:none;font-size:16px;cursor:pointer;padding:2px 4px;}

.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;color:var(--text-soft);}
.summary-row.total{font-size:16.5px;font-weight:700;color:var(--text);border-top:1.5px dashed var(--border);margin-top:6px;padding-top:12px;font-family:'Baloo Da 2',sans-serif;}
.pay-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 4px;}
.pay-method{padding:10px 4px;border-radius:11px;border:1.5px solid var(--border);text-align:center;font-size:11.5px;font-weight:600;cursor:pointer;background:var(--white);}
.pay-method.active{background:var(--sky-light);border-color:var(--sky);color:var(--sky-dark);}

/* List rows */
.list-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--sky-light);color:var(--sky-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;font-family:'Baloo Da 2',sans-serif;}
.lr-title{font-size:14px;font-weight:600;}
.lr-sub{font-size:11.5px;color:var(--text-soft);margin-top:1px;}
.lr-right{text-align:right;}
.lr-amount{font-size:14px;font-weight:700;font-family:'Baloo Da 2',sans-serif;}
.tag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;}
.tag-green{background:var(--success-bg);color:var(--success);}
.tag-orange{background:var(--warning-bg);color:var(--warning);}
.tag-red{background:var(--error-bg);color:var(--error);}
.tag-blue{background:var(--sky-light);color:var(--sky-dark);}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-soft);}
.empty-state svg{width:52px;height:52px;color:var(--sky-light);margin-bottom:10px;}
.empty-state p{font-size:13px;margin:0;}

.search-wrap{display:flex;align-items:center;gap:8px;background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;}
.search-wrap svg{width:16px;height:16px;color:var(--text-soft);}
.search-wrap input{border:none;outline:none;flex:1;font-family:inherit;font-size:13.5px;background:transparent;}

.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px;}
.more-item{background:var(--white);border-radius:16px;padding:16px 14px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column;gap:10px;cursor:pointer;}
.more-item .mi-icon{width:38px;height:38px;border-radius:11px;background:var(--sky-light);color:var(--sky-dark);display:flex;align-items:center;justify-content:center;}
.more-item .mi-icon svg{width:18px;height:18px;}
.more-item .mi-title{font-size:13.5px;font-weight:700;}
.more-item .mi-sub{font-size:11px;color:var(--text-soft);}

.toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%);
  background:var(--text);color:#fff;padding:11px 20px;border-radius:12px;font-size:13px;
  z-index:200;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;
  animation:toastin .25s ease;max-width:85%;text-align:center;
}
.toast.success{background:var(--success);}
.toast.error{background:var(--error);}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

.invoice-box{background:var(--white);border-radius:16px;padding:18px;border:1.5px dashed var(--sky);}
.invoice-head{text-align:center;padding-bottom:12px;border-bottom:1.5px dashed var(--border);margin-bottom:12px;}
.invoice-shop{font-family:'Baloo Da 2',sans-serif;font-size:16px;font-weight:700;color:var(--sky-dark);}
.invoice-meta{font-size:11.5px;color:var(--text-soft);margin-top:6px;line-height:1.6;}
.invoice-table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0;}
.invoice-table th{text-align:right;color:var(--text-soft);font-weight:600;padding:6px 4px;border-bottom:1.5px solid var(--border);font-size:11px;}
.invoice-table th:first-child,.invoice-table td:first-child{text-align:right;}
.invoice-table td{padding:7px 4px;border-bottom:1px dashed var(--border);}
.invoice-table td:first-child{text-align:right;font-weight:600;}

.tab-underline{display:flex;gap:18px;border-bottom:1.5px solid var(--border);margin-bottom:12px;overflow-x:auto;}
.tab-item{padding:8px 2px;font-size:13px;font-weight:600;color:var(--text-soft);white-space:nowrap;position:relative;cursor:pointer;}
.tab-item.active{color:var(--sky-dark);}
.tab-item.active::after{content:'';position:absolute;bottom:-1.5px;left:0;right:0;height:2.5px;background:var(--sky);border-radius:3px;}

.notif-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-item.unread{background:var(--sky-lighter);margin:0 -16px;padding:13px 16px;}
.ni-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ni-text{font-size:13px;font-weight:600;}
.ni-time{font-size:11px;color:var(--text-soft);margin-top:2px;}

.report-stat{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.report-stat:last-child{border-bottom:none;}
.rs-label{font-size:13px;color:var(--text-soft);font-weight:500;}
.rs-value{font-size:15px;font-weight:700;font-family:'Baloo Da 2',sans-serif;}

.fw-btn-row{display:flex;gap:10px;margin-top:16px;}
.fw-btn-row .btn{flex:1;}

/* Auth screen */
.auth-shell{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px 18px;background:linear-gradient(135deg,var(--sky) 0%,var(--sky-dark) 100%);
}
.auth-card{width:100%;max-width:380px;background:var(--white);border-radius:22px;box-shadow:var(--shadow-lg);padding:26px 22px;}
.auth-logo{text-align:center;margin-bottom:18px;}
.auth-logo .emoji{font-size:34px;}
.auth-logo .name{font-family:'Baloo Da 2',sans-serif;font-size:17px;font-weight:700;color:var(--sky-dark);margin-top:6px;line-height:1.3;}
.auth-logo .sub{font-size:12px;color:var(--text-soft);margin-top:4px;}
.auth-error{background:var(--error-bg);color:var(--error);font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:12px;}
.auth-toggle{text-align:center;font-size:12.5px;color:var(--text-soft);margin-top:14px;}
.auth-toggle span{color:var(--sky-dark);font-weight:700;cursor:pointer;}
.auth-loading{text-align:center;color:#fff;font-family:'Hind Siliguri',sans-serif;font-size:14px;}
</style>
</head>

<div id="app" class="app-shell"></div>

function isSameDay(iso,d2){const d1=new Date(iso);return d1.toDateString()===d2.toDateString();}
function isToday(iso){return isSameDay(iso,new Date());}
function isYesterday(iso){const y=new Date();y.setDate(y.getDate()-1);return isSameDay(iso,y);}
function isThisWeek(iso){const d=new Date(iso),now=new Date();const start=new Date(now);start.setDate(now.getDate()-now.getDay());start.setHours(0,0,0,0);return d>=start;}
function isThisMonth(iso){const d=new Date(iso),now=new Date();return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();}

}

/* ============ FIFO BATCH STOCK / COSTING ============ */
function ensureBatches(p){
  if(!Array.isArray(p.batches)){
    p.batches = p.stock>0 ? [{id:newId('b'),qty:p.stock,cost:p.purchasePrice||0,date:new Date().toISOString()}] : [];
  }
}
function addStockBatch(p,qty,cost,date){
  ensureBatches(p);
  if(qty<=0) return;
  p.batches.push({id:newId('b'),qty,cost,date:date||new Date().toISOString()});
  p.stock = (p.stock||0)+qty;
  p.purchasePrice = cost;
}
function consumeStockFIFO(p,qty){
  ensureBatches(p);
  let remaining = qty;
  let totalCost = 0;
  const lines=[];
  while(remaining>0 && p.batches.length>0){
    const b = p.batches[0];
    const take = Math.min(b.qty,remaining);
    totalCost += take*b.cost;
    lines.push({qty:take,cost:b.cost});
    b.qty -= take;
    remaining -= take;
    if(b.qty<=0) p.batches.shift();
  }
  if(remaining>0){
    totalCost += remaining*(p.purchasePrice||0);
    lines.push({qty:remaining,cost:p.purchasePrice||0});
    remaining=0;
  }
  p.stock = Math.max(0,(p.stock||0)-qty);
  return {totalCost, avgCost: qty>0?totalCost/qty:0, lines};
}

function saveState(){
  if(!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    db.collection('shops').doc(currentUser.uid).set({
      settings: state.settings,
      categories: state.categories,
      products: state.products,
      customers: state.customers,
      sales: state.sales,
      purchases: state.purchases,
      ledger: state.ledger,
      history: state.history,
      notifications: state.notifications,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }, {merge:true}).catch(err=>{
      console.error('Firestore save error:', err);
    });
  }, 250);
}

async function loadUserData(uidStr){
  const docRef = db.collection('shops').doc(uidStr);
  try{
    const snap = await docRef.get();
    if(snap.exists){
      const d = snap.data() || {};
      if(d.settings) Object.assign(state.settings, d.settings);
      if(Array.isArray(d.categories)) state.categories = d.categories;
      if(Array.isArray(d.products)) state.products = d.products;
      if(Array.isArray(d.customers) && d.customers.length) state.customers = d.customers;
      if(Array.isArray(d.sales)) state.sales = d.sales;
      if(Array.isArray(d.purchases)) state.purchases = d.purchases;
      if(Array.isArray(d.ledger)) state.ledger = d.ledger;
      if(Array.isArray(d.history)) state.history = d.history;
      if(Array.isArray(d.notifications)) state.notifications = d.notifications;
    } else {
      await docRef.set({
        settings: state.settings,
        categories: state.categories,
        products: state.products,
        customers: state.customers,
        sales: state.sales,
        purchases: state.purchases,
        ledger: state.ledger,
        history: state.history,
        notifications: state.notifications,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    }
    dataLoaded = true;
  } catch(err){
    console.error('Firestore load error:', err);
    dataLoaded = true;
  }
}

  return map[code] || (err && err.message) || 'কিছু একটা সমস্যা হয়েছে, আবার চেষ্টা করুন';
}

function handleLogin(){
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  if(!email || !password){ authErrorMsg='ইমেইল ও পাসওয়ার্ড দিন'; render(); return; }
  authBusy=true; authErrorMsg=''; render();
  auth.signInWithEmailAndPassword(email,password)
    .catch(err=>{ authBusy=false; authErrorMsg=authErrorText(err); render(); });
}
function handleSignup(){
  const email = document.getElementById('auth_email').value.trim();
  const password = document.getElementById('auth_password').value;
  if(!email || !password){ authErrorMsg='ইমেইল ও পাসওয়ার্ড দিন'; render(); return; }
  authBusy=true; authErrorMsg=''; render();
  auth.createUserWithEmailAndPassword(email,password)
    .catch(err=>{ authBusy=false; authErrorMsg=authErrorText(err); render(); });
}

function render(){
  const app = document.getElementById('app');

  if(!currentUser){
    app.innerHTML = renderAuthScreen();
    return;
  }
  if(!dataLoaded){
    app.innerHTML = `<div class="auth-shell"><div class="auth-loading">লোড হচ্ছে...</div></div>`;
    return;
  }

  let body = '';
  if(state.view==='dashboard') body = renderDashboard();
  else if(state.view==='pos') body = renderPOS();
  else if(state.view==='customers') body = renderCustomers();
  else if(state.view==='customerProfile') body = renderCustomerProfile();
  else if(state.view==='stock') body = renderStock();
  else if(state.view==='purchase') body = renderPurchase();
  else if(state.view==='history') body = renderHistory();

  else if(state.view==='categories') body = renderCategories();

function renderDashboard(){
  const todaySales = state.sales.filter(s=>isToday(s.date));
  const todayTotal = todaySales.reduce((a,s)=>a+s.grandTotal,0);
  const todayProfit = todaySales.reduce((a,s)=> a + s.items.reduce((pa,it)=>{
    const cost = (typeof it.costTotal==='number') ? it.costTotal : ((productById(it.productId)?productById(it.productId).purchasePrice:0)*it.qty);
    return pa + (it.price*it.qty - cost);
  },0) - s.discount, 0);
  const totalDue = state.customers.reduce((a,c)=>a+c.due,0);
  const stockValue = state.products.reduce((a,p)=>a+p.stock*p.purchasePrice,0);
  const lowStock = state.products.filter(p=>p.stock<=p.minStock);
  const todayDueSales = todaySales.filter(s=>s.due>0).reduce((a,s)=>a+s.due,0);

  const chartDays=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const total = state.sales.filter(s=>isSameDay(s.date,d)).reduce((a,s)=>a+s.grandTotal,0);
    chartDays.push({d,total});

  const maxVal = Math.max(...chartDays.map(c=>c.total),1);

  return `

    <div class="stat-card stat-blue"><div class="stat-icon">${I.taka}</div><div class="stat-label">আজকের মোট বিক্রি</div><div class="stat-value">${cur(todayTotal)}</div></div>

    <div class="stat-card stat-orange"><div class="stat-icon">${I.wallet}</div><div class="stat-label">মোট বাকি</div><div class="stat-value">${cur(totalDue)}</div></div>
    <div class="stat-card stat-blue"><div class="stat-icon">${I.boxes}</div><div class="stat-label">মোট স্টকের মূল্য</div><div class="stat-value">${cur(stockValue)}</div></div>
    <div class="stat-card stat-blue"><div class="stat-icon">${I.box}</div><div class="stat-label">মোট পণ্য</div><div class="stat-value">${state.products.length} টি</div></div>
    <div class="stat-card stat-red"><div class="stat-icon">${I.alert}</div><div class="stat-label">কম স্টকের পণ্য</div><div class="stat-value">${lowStock.length} টি</div></div>
    <div class="stat-card stat-green"><div class="stat-icon">${I.receipt}</div><div class="stat-label">আজকের বিক্রির সংখ্যা</div><div class="stat-value">${todaySales.length} টি</div></div>
    <div class="stat-card stat-orange"><div class="stat-icon">${I.wallet}</div><div class="stat-label">আজকের বাকি বিক্রি</div><div class="stat-value">${cur(todayDueSales)}</div></div>
  </div>

  <div class="section-title">বিক্রয়ের সারসংক্ষেপ (গত ৭ দিন)</div>
  <div class="card chart-wrap">
    <div class="bars">
      ${chartDays.map(c=>`
        <div class="bar-col">
          <div style="font-size:10px;color:var(--sky-dark);font-weight:700;">${c.total>0?Math.round(c.total/100)/10+'k':''}</div>
          <div class="bar" style="height:${Math.max(6,(c.total/maxVal)*90)}px;"></div>
          <div class="bar-day">${['র','সো','ম','বু','বৃ','শু','শ'][c.d.getDay()]}</div>
        </div>`).join('')}
    </div>

function addToCart(pid){
  const p = productById(pid);
  if(!p || p.stock<=0){ showToast('এই পণ্যটি স্টকে নেই','error'); return; }
  const line = state.cart.find(c=>c.productId===pid);
  if(line){
    if(line.qty+1>p.stock){ showToast('পর্যাপ্ত স্টক নেই','error'); return; }
    line.qty++;
  } else {
    state.cart.push({productId:pid, name:p.name, price:p.sellingPrice, qty:1});
  }
  render();
}
function changeQty(pid,delta){
  const line = state.cart.find(c=>c.productId===pid);
  if(!line) return;
  const p = productById(pid);
  const newQty = line.qty+delta;
  if(newQty<=0){ state.cart = state.cart.filter(c=>c.productId!==pid); }
  else if(p && newQty>p.stock){ showToast('পর্যাপ্ত স্টক নেই','error'); return; }
  else { line.qty = newQty; }
  render();
}
function removeCartLine(pid){ state.cart = state.cart.filter(c=>c.productId!==pid); render(); }

function cartSubtotal(){ return state.cart.reduce((a,c)=>a+c.price*c.qty,0); }
function cartGrandTotal(){ return Math.max(0, cartSubtotal() - Number(state.cartDiscount||0)); }

    <div style="text-align:right;"><div style="font-size:11.5px;color:var(--text-soft);">মোট পণ্য</div><div style="font-size:19px;font-weight:700;font-family:'Baloo Da 2',sans-serif;">${state.products.length}</div></div>
  </div>
  <div class="search-wrap" style="margin-top:14px;">${I.search}<input value="${escapeHtml(state.stockSearch)}" placeholder="পণ্য, SKU বা বারকোড খুঁজুন..." oninput="state.stockSearch=this.value; render();"></div>
  <div class="chip-row">
    ${cats.map(c=>`<div class="chip ${state.stockCategory===c?'active':''}" onclick="state.stockCategory='${escapeAttr(c)}'; render();">${c}</div>`).join('')}

  </div>
  <div class="fw-btn-row" style="margin:6px 0 12px;">

  </div>
  <div class="card">
    ${products.length===0?`<div class="empty-state">${I.box}<p>${state.products.length===0?'এখনো কোনো পণ্য যোগ করা হয়নি':'কোনো পণ্য পাওয়া যায়নি'}</p></div>`:

/* ============ HISTORY ============ */
function renderHistory(){
  const types = ['সব','বিক্রি','ক্রয়','বাকি যোগ','বাকি পরিশোধ','স্টক সমন্বয়'];
  const typeMap = {'সব':'all','বিক্রি':'sale','ক্রয়':'purchase','বাকি যোগ':'due_added','বাকি পরিশোধ':'payment','স্টক সমন্বয়':'stock_adjust'};

  let items = state.history.slice();
  items = items.filter(h=>{
    if(state.historyFilter==='today') return isToday(h.date);
    if(state.historyFilter==='yesterday') return isYesterday(h.date);
    if(state.historyFilter==='week') return isThisWeek(h.date);
    if(state.historyFilter==='month') return isThisMonth(h.date);
    return true;
  });
  if(state.historyType!=='সব'){
    items = items.filter(h=>h.type===typeMap[state.historyType]);
  }
  items.sort((a,b)=>new Date(b.date)-new Date(a.date));

  const filters = [{k:'today',l:'আজ'},{k:'yesterday',l:'গতকাল'},{k:'week',l:'এই সপ্তাহ'},{k:'month',l:'এই মাস'},{k:'all',l:'সব সময়'}];

  return `
  <div class="chip-row">
    ${filters.map(f=>`<div class="chip ${state.historyFilter===f.k?'active':''}" onclick="state.historyFilter='${f.k}'; render();">${f.l}</div>`).join('')}
  </div>
  <div class="chip-row">
    ${types.map(t=>`<div class="chip ${state.historyType===t?'active':''}" onclick="state.historyType='${t}'; render();">${t}</div>`).join('')}
  </div>
  <div class="card">
    ${items.length===0?`<div class="empty-state">${I.history}<p>কোনো লেনদেন পাওয়া যায়নি</p></div>`:
    items.map(h=>{
      const icons = {sale:I.receipt,purchase:I.bag,due_added:I.wallet,payment:I.taka,stock_adjust:I.boxes};
      const colors = {sale:'var(--sky-dark)',purchase:'var(--warning)',due_added:'var(--error)',payment:'var(--success)',stock_adjust:'var(--sky-dark)'};
      const bgs = {sale:'var(--sky-light)',purchase:'var(--warning-bg)',due_added:'var(--error-bg)',payment:'var(--success-bg)',stock_adjust:'var(--sky-light)'};
      return `
      <div class="list-row">
        <div class="avatar" style="background:${bgs[h.type]||'var(--sky-light)'};color:${colors[h.type]||'var(--sky-dark)'};">${icons[h.type]||I.info}</div>
        <div style="flex:1;"><div class="lr-title">${h.desc}</div><div class="lr-sub">${fmtDate(h.date)}</div></div>
        <div class="lr-amount" style="color:${['payment'].includes(h.type)?'var(--success)':(['due_added','purchase'].includes(h.type)?'var(--error)':'var(--text)')};">${cur(h.amount)}</div>
        <button class="icon-btn" style="background:var(--error-bg);color:var(--error);width:30px;height:30px;margin-left:2px;" onclick="deleteHistoryEntry('${h.id}')">${I.trash}</button>
      </div>`;
    }).join('')}
  </div>`;
}

/* ============ REPORTS ============ */
function renderReports(){
  const ranges={daily:'আজকের',weekly:'সাপ্তাহিক',monthly:'মাসিক'};
  const filterFn = state.reportRange==='daily'?isToday:(state.reportRange==='weekly'?isThisWeek:isThisMonth);
  const sales = state.sales.filter(s=>filterFn(s.date));
  const purchases = state.purchases.filter(p=>filterFn(p.date));
  const totalSales = sales.reduce((a,s)=>a+s.grandTotal,0);
  const totalProfit = sales.reduce((a,s)=> a + s.items.reduce((pa,it)=>{
    const cost = (typeof it.costTotal==='number') ? it.costTotal : ((productById(it.productId)?productById(it.productId).purchasePrice:0)*it.qty);
    return pa + (it.price*it.qty - cost);
  },0) - s.discount,0);
  const totalPurchase = purchases.reduce((a,p)=>a+p.total,0);
  const totalDue = state.customers.reduce((a,c)=>a+c.due,0);
  const stockValue = state.products.reduce((a,p)=>a+p.stock*p.purchasePrice,0);

  const qtyMap = {};
  sales.forEach(s=>s.items.forEach(it=>{ qtyMap[it.productId]=(qtyMap[it.productId]||0)+it.qty; }));
  const bestSelling = Object.entries(qtyMap).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([pid,qty])=>({p:productById(pid),qty})).filter(x=>x.p);
  const lowStockProducts = state.products.filter(p=>p.stock<=p.minStock).sort((a,b)=>a.stock-b.stock);

  return `
  <div class="chip-row">
    ${Object.entries(ranges).map(([k,l])=>`<div class="chip ${state.reportRange===k?'active':''}" onclick="state.reportRange='${k}'; render();">${l}</div>`).join('')}
  </div>
  <div class="card">
    <div class="report-stat"><div class="rs-label">${ranges[state.reportRange]} বিক্রয়</div><div class="rs-value" style="color:var(--sky-dark);">${cur(totalSales)}</div></div>
    <div class="report-stat"><div class="rs-label">লাভ রিপোর্ট</div><div class="rs-value" style="color:var(--success);">${cur(totalProfit)}</div></div>
    <div class="report-stat"><div class="rs-label">ক্রয় রিপোর্ট</div><div class="rs-value" style="color:var(--warning);">${cur(totalPurchase)}</div></div>
    <div class="report-stat"><div class="rs-label">বাকি রিপোর্ট (সর্বমোট)</div><div class="rs-value" style="color:var(--error);">${cur(totalDue)}</div></div>
    <div class="report-stat"><div class="rs-label">স্টক রিপোর্ট (মূল্য)</div><div class="rs-value">${cur(stockValue)}</div></div>
    <div class="report-stat"><div class="rs-label">মোট বিক্রয় সংখ্যা</div><div class="rs-value">${sales.length} টি</div></div>
  </div>

  <div class="section-title">🏆 বেস্ট সেলিং প্রোডাক্ট</div>
  <div class="card">
    ${bestSelling.length===0?`<div class="empty-state">${I.chart}<p>এই সময়ে কোনো বিক্রয় নেই</p></div>`:
    bestSelling.map((b,i)=>`
      <div class="list-row">
        <div class="avatar">${i+1}</div>
        <div style="flex:1;"><div class="lr-title">${b.p.name}</div><div class="lr-sub">${categoryName(b.p.categoryId)}</div></div>
        <div class="lr-amount">${b.qty} ${b.p.unit}</div>
      </div>`).join('')}
  </div>

  <div class="section-title">⚠️ কম স্টক পণ্য</div>
  <div class="card">
    ${lowStockProducts.length===0?`<div class="empty-state">${I.check}<p>সব পণ্যের স্টক পর্যাপ্ত</p></div>`:
    lowStockProducts.map(p=>`
      <div class="list-row">
        <div class="avatar" style="background:var(--error-bg);color:var(--error);">${I.alert}</div>
        <div style="flex:1;"><div class="lr-title">${p.name}</div><div class="lr-sub">সর্বনিম্ন: ${p.minStock} ${p.unit}</div></div>
        <div class="tag tag-red">${p.stock} ${p.unit}</div>
      </div>`).join('')}
  </div>`;
}

/* ============ MODALS ============ */
function openModal(name,arg){ state.modal=name; state.modalArg=arg; render(); }
function closeModal(){ state.modal=null; state.modalArg=null; render(); }

function modalHTML(){
  if(!state.modal) return '';
  const m = state.modal;
  let inner = '';
  if(m==='cart') inner = cartModalHTML();
  else if(m==='newCustomerQuick' || m==='newCustomer') inner = customerFormModal();
  else if(m==='collectPayment') inner = collectPaymentModal();
  else if(m==='addDue') inner = addDueModal();
  else if(m==='addProduct' || m==='editProduct') inner = productFormModal();
  else if(m==='newCategory' || m==='editCategory') inner = categoryFormModal();
  else if(m==='newPurchase') inner = purchaseFormModal();
  else if(m==='invoice') inner = invoiceModal();
  else if(m==='checkout') inner = checkoutModal();
  const isCenter = ['invoice'].includes(m);
  return `<div class="overlay ${isCenter?'center':''}" onclick="if(event.target===this) closeModal()"><div class="sheet">${inner}</div></div>`;
}

function refreshCheckout(){ if(state.modal==='checkout'){ document.querySelector('.sheet').innerHTML = checkoutModal(); } }
function refreshCheckoutDue(){
  const due = Math.max(0,cartGrandTotal()-(state.paidAmount||0));
  const row = document.getElementById('dueRow');
  if(row) row.innerHTML = `<span>বাকি (Due)</span><span style="font-weight:700;color:var(--error);">${cur(due)}</span>`;
}

function completeSale(){
  if(state.cart.length===0){ showToast('কার্ট খালি আছে','error'); return; }
  const custSel = document.getElementById('checkoutCustomer');
  const customerId = custSel ? custSel.value : (state.cartCustomerId||'cu4');
  const paid = Number(document.getElementById('paidAmountInput')?.value ?? state.paidAmount) || 0;
  const grandTotal = cartGrandTotal();
  const due = Math.max(0, grandTotal-paid);

  const invoiceNo = state.settings.invoicePrefix+'-'+String(state.sales.length+1001);

  const saleItems = state.cart.map(c=>{
    const p = productById(c.productId);
    let costTotal=0, costPerUnit=0;
    if(p){
      const res = consumeStockFIFO(p,c.qty);
      costTotal = res.totalCost;
      costPerUnit = res.avgCost;
      checkStockNotify(p);
    }
    return {productId:c.productId,name:c.name,qty:c.qty,price:c.price,costTotal,costPerUnit};
  });

  const sale = {
    id:newId('s'), invoiceNo, date:new Date().toISOString(), customerId,
    items: saleItems,
    subtotal: cartSubtotal(), discount: Number(state.cartDiscount||0), grandTotal, paid, due,
    paymentMethod: state.payMethod,
  };
  state.sales.push(sale);

  if(due>0){
    const cust = customerById(customerId);
    if(cust){ cust.due += due; }
    state.ledger.unshift({id:newId('l'),customerId,type:'due_added',amount:due,date:sale.date,note:'ইনভয়েস '+invoiceNo,refId:sale.id});
    addNotification('due_payment', (cust?cust.name:'কাস্টমার')+' - নতুন বাকি যোগ হয়েছে '+cur(due));
  }
  addHistory('sale', 'বিক্রয় সম্পন্ন — '+invoiceNo, grandTotal, sale.id);

  state.cart = []; state.cartDiscount=0; state.paidAmount=0; state.cartCustomerId=null; state.payMethod='ক্যাশ';
  state.lastInvoiceId = sale.id;
  state.modal='invoice'; state.modalArg=sale.id;
  saveState();
  render();
  showToast('বিক্রি সফলভাবে সম্পন্ন হয়েছে!','success');
}

/* --- Delete history / ledger entries (owner-editable log) --- */
function deleteLedgerEntry(lid){
  const l = state.ledger.find(x=>x.id===lid);
  if(!l) return;
  if(!confirm('এই লেনদেনটি মুছে ফেলতে চান? এতে কাস্টমারের বাকির পরিমাণ স্বয়ংক্রিয়ভাবে সমন্বয় হবে।')) return;
  const c = customerById(l.customerId);
  if(c){
    if(l.type==='due_added') c.due = Math.max(0, c.due-l.amount);
    else if(l.type==='payment') c.due = c.due + l.amount;
  }
  state.ledger = state.ledger.filter(x=>x.id!==lid);
  state.history = state.history.filter(h=>h.refId!==lid);
  saveState();
  showToast('লেনদেন মুছে ফেলা হয়েছে','success');
  render();
}
function deleteHistoryEntry(hid){
  const h = state.history.find(x=>x.id===hid);
  if(!h) return;
  if(h.type==='due_added' || h.type==='payment'){
    if(h.refId && state.ledger.some(l=>l.id===h.refId)){ deleteLedgerEntry(h.refId); return; }
    if(!confirm('এই হিস্ট্রি এন্ট্রিটি মুছে ফেলতে চান?')) return;
    state.history = state.history.filter(x=>x.id!==hid);
    saveState(); render(); showToast('মুছে ফেলা হয়েছে','success');
    return;
  }
  if(h.type==='sale'){
    if(!confirm('এই বিক্রয় হিস্ট্রি লগ মুছে ফেললে শুধু তালিকা থেকে সরে যাবে — স্টক ও কাস্টমারের বাকি এতে পরিবর্তন হবে না। তবুও কি মুছবেন?')) return;
    state.history = state.history.filter(x=>x.id!==hid);
    saveState(); render(); showToast('হিস্ট্রি লগ মুছে ফেলা হয়েছে','success');
    return;
  }
  if(h.type==='purchase'){
    if(!confirm('এই ক্রয় হিস্ট্রি লগ মুছে ফেললে শুধু তালিকা থেকে সরে যাবে — স্টক এতে পরিবর্তন হবে না। তবুও কি মুছবেন?')) return;
    state.history = state.history.filter(x=>x.id!==hid);
    saveState(); render(); showToast('হিস্ট্রি লগ মুছে ফেলা হয়েছে','success');
    return;
  }
  if(!confirm('এই হিস্ট্রি এন্ট্রিটি মুছে ফেলতে চান?')) return;
  state.history = state.history.filter(x=>x.id!==hid);
  saveState(); render(); showToast('মুছে ফেলা হয়েছে','success');
}

/* --- Product form modal --- */
function productFormModal(){
  const editing = state.modal==='editProduct';
  const p = editing ? productById(state.modalArg) : null;
  return `
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>${editing?'পণ্য এডিট করুন':'নতুন পণ্য যোগ করুন'}</h3><button class="close-x" onclick="closeModal()">${I.close}</button></div>
  <div class="field"><label>পণ্যের নাম *</label><input id="pf_name" value="${p?escapeHtml(p.name):''}" placeholder="পণ্যের নাম"></div>
  <div class="field"><label>ক্যাটাগরি</label>
    <select id="pf_cat">${state.categories.length? state.categories.map(c=>`<option value="${c.id}" ${p&&p.categoryId===c.id?'selected':''}>${c.name}</option>`).join('') : '<option value="">কোনো ক্যাটাগরি নেই — আগে যোগ করুন</option>'}</select>
  </div>
  <div class="field-row">
    <div class="field"><label>SKU</label><input id="pf_sku" value="${p?escapeHtml(p.sku):''}" placeholder="SKU-001"></div>
    <div class="field"><label>ইউনিট</label><input id="pf_unit" value="${p?escapeHtml(p.unit):'পিস'}" placeholder="কেজি/পিস/বোতল"></div>
  </div>
  <div class="field"><label>বারকোড ${I.scan}</label><input id="pf_barcode" value="${p?escapeHtml(p.barcode):''}" placeholder="বারকোড স্ক্যান বা লিখুন"></div>
  <div class="field-row">
    <div class="field"><label>${editing?'সর্বশেষ ক্রয় মূল্য':'ক্রয় মূল্য'} *</label><input id="pf_pp" type="number" min="0" value="${p?p.purchasePrice:''}"></div>
    <div class="field"><label>বিক্রয় মূল্য * <span style="font-weight:400;">(সব স্টকে প্রযোজ্য)</span></label><input id="pf_sp" type="number" min="0" value="${p?p.sellingPrice:''}"></div>
  </div>
  <div class="field-row">
    <div class="field"><label>বর্তমান স্টক ${editing?'(স্বয়ংক্রিয়)':''}</label><input id="pf_stock" type="number" min="0" value="${p?p.stock:0}" ${editing?'disabled':''}></div>
    <div class="field"><label>সর্বনিম্ন স্টক</label><input id="pf_min" type="number" min="0" value="${p?p.minStock:5}"></div>
  </div>
  ${editing?`<div class="field"><label>স্টক সমন্বয় (+/-) — যেমন নষ্ট/হারানো পণ্য বাদ দিতে -২ লিখুন, নতুন যোগ করতে +৩ লিখুন (উপরের "সর্বশেষ ক্রয় মূল্য" দিয়ে গণনা হবে)</label><input id="pf_adjust" type="number" value="0"></div>`:''}
  <div class="fw-btn-row">
    ${editing?`<button class="btn btn-outline btn-block" style="color:var(--error);border-color:var(--error);" onclick="deleteProduct('${p.id}')">${I.trash} মুছুন</button>`:''}
    <button class="btn btn-primary btn-block" onclick="saveProduct(${editing?`'${p.id}'`:'null'})">${I.check} সংরক্ষণ করুন</button>
  </div>
  `;
}
function saveProduct(pid){
  const name = document.getElementById('pf_name').value.trim();
  if(!name){ showToast('পণ্যের নাম দিন','error'); return; }
  const categoryId = document.getElementById('pf_cat').value;
  const sku = document.getElementById('pf_sku').value.trim()||('SKU-'+(uid++));
  const unit = document.getElementById('pf_unit').value.trim()||'পিস';
  const barcode = document.getElementById('pf_barcode').value.trim();
  const purchasePrice = Number(document.getElementById('pf_pp').value)||0;
  const sellingPrice = Number(document.getElementById('pf_sp').value)||0;
  const minStock = Number(document.getElementById('pf_min').value)||0;

  if(pid){
    const p = productById(pid);
    ensureBatches(p);
    p.name=name; p.categoryId=categoryId; p.sku=sku; p.unit=unit; p.barcode=barcode; p.sellingPrice=sellingPrice; p.minStock=minStock;
    const adjustEl = document.getElementById('pf_adjust');
    const adjust = adjustEl? (Number(adjustEl.value)||0) : 0;
    if(adjust>0){ addStockBatch(p,adjust,purchasePrice,new Date().toISOString()); addHistory('stock_adjust', p.name+' — স্টক সমন্বয় (+'+adjust+')', adjust*purchasePrice, p.id); }
    else if(adjust<0){ const take=Math.min(-adjust,p.stock); consumeStockFIFO(p,take); addHistory('stock_adjust', p.name+' — স্টক সমন্বয় (-'+take+')', take*purchasePrice, p.id); p.purchasePrice = purchasePrice; }
    else { p.purchasePrice = purchasePrice; }
    checkStockNotify(p);
    showToast('পণ্য আপডেট করা হয়েছে','success');
  } else {
    const stock = Number(document.getElementById('pf_stock').value)||0;
    const np = {id:newId('p'),name,categoryId,sku,unit,barcode,purchasePrice,sellingPrice,stock:0,minStock,batches:[]};
    if(stock>0) addStockBatch(np,stock,purchasePrice,new Date().toISOString());
    state.products.push(np);
    showToast('নতুন পণ্য যোগ করা হয়েছে','success');
  }
  saveState();
  closeModal();
}
function deleteProduct(pid){
  state.products = state.products.filter(p=>p.id!==pid);
  saveState();
  showToast('পণ্য মুছে ফেলা হয়েছে','success');
  closeModal();
}

/* --- Category form modal --- */
function categoryFormModal(){
  const editing = state.modal==='editCategory';
  const c = editing ? state.categories.find(x=>x.id===state.modalArg) : null;
  return `
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>${editing?'ক্যাটাগরি এডিট':'নতুন ক্যাটাগরি'}</h3><button class="close-x" onclick="closeModal()">${I.close}</button></div>
  <div class="field"><label>ক্যাটাগরির নাম *</label><input id="cat_name" value="${c?escapeHtml(c.name):''}" placeholder="যেমন: প্রসাধনী"></div>
  <button class="btn btn-primary btn-block" onclick="saveCategory(${editing?`'${c.id}'`:'null'})">${I.check} সংরক্ষণ করুন</button>
  `;
}
function saveCategory(cid){
  const name = document.getElementById('cat_name').value.trim();
  if(!name){ showToast('নাম দিন','error'); return; }
  if(cid){ state.categories.find(c=>c.id===cid).name=name; showToast('ক্যাটাগরি আপডেট হয়েছে','success'); }
  else { state.categories.push({id:newId('c'),name}); showToast('ক্যাটাগরি যোগ হয়েছে','success'); }
  saveState();
  closeModal();
}

/* --- Purchase form modal --- */
let purchaseItems = [];
function purchaseFormModal(){
  return `
  <div class="sheet-handle"></div>
  <div class="sheet-head"><h3>নতুন ক্রয়</h3><button class="close-x" onclick="closeModal()">${I.close}</button></div>
  <div class="field"><label>সাপ্লায়ারের নাম</label><input id="pu_supplier" placeholder="সাপ্লায়ারের নাম"></div>
  <div class="field"><label>পণ্য নির্বাচন করুন</label>
    <select id="pu_product">
      <option value="">-- পণ্য বাছাই করুন --</option>
      ${state.products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}
      <option value="__new__">+ নতুন পণ্য</option>
    </select>
  </div>
  <div id="pu_newProductFields" class="hide">
    <div class="field"><label>নতুন পণ্যের নাম</label><input id="pu_new_name" placeholder="পণ্যের নাম"></div>
  </div>
  <div class="field-row">
    <div class="field"><label>পরিমাণ</label><input id="pu_qty" type="number" min="1" value="1"></div>
    <div class="field"><label>ক্রয় মূল্য (প্রতি একক)</label><input id="pu_price" type="number" min="0" value="0"></div>
  </div>
  <div class="field"><label>নতুন বিক্রয় মূল্য (প্রতি একক) — ফাঁকা রাখলে আগের বিক্রয় মূল্যই থাকবে, দিলে পুরাতন স্টকেও প্রযোজ্য হবে</label><input id="pu_sellprice" type="number" min="0" placeholder="যেমন: ৩৫"></div>
  <button class="btn btn-ghost btn-block" onclick="addPurchaseItem()">${I.plus} আইটেম যোগ করুন</button>

  <div style="margin-top:14px;">
    ${purchaseItems.length===0?`<div class="empty-state" style="padding:16px;">${I.bag}<p>কোনো আইটেম যোগ করা হয়নি</p></div>`:
    purchaseItems.map((it,idx)=>`
      <div class="cart-line-item">
        <div class="cli-info"><div class="cli-name">${it.name}</div><div class="cli-price">${it.qty} × ${cur(it.price)}${it.sellPrice?' · নতুন বিক্রয় মূল্য '+cur(it.sellPrice):''}</div></div>
        <div class="cli-total">${cur(it.qty*it.price)}</div>
        <button class="cli-remove" onclick="purchaseItems.splice(${idx},1); refreshPurchaseModal();">${I.close}</button>
      </div>`).join('')}
  </div>
  ${purchaseItems.length?`
  <div class="summary-row total"><span>মোট</span><span>${cur(purchaseItems.reduce((a,i)=>a+i.qty*i.price,0))}</span></div>
  <div class="field" style="margin-top:10px;"><label>পরিশোধিত পরিমাণ</label><input id="pu_paid" type="number" min="0" value="${purchaseItems.reduce((a,i)=>a+i.qty*i.price,0)}"></div>
  <button class="btn btn-primary btn-block" onclick="completePurchase()">${I.check} ক্রয় সম্পন্ন করুন</button>
  `:''}
  `;
}
function refreshPurchaseModal(){ if(state.modal==='newPurchase'){ document.querySelector('.sheet').innerHTML = purchaseFormModal(); attachPurchaseListeners(); } }
function attachPurchaseListeners(){
  const sel = document.getElementById('pu_product');
  if(sel) sel.addEventListener('change',function(){
    document.getElementById('pu_newProductFields').classList.toggle('hide', this.value!=='__new__');
  });
}
function addPurchaseItem(){
  const sel = document.getElementById('pu_product').value;
  const qty = Number(document.getElementById('pu_qty').value)||1;
  const price = Number(document.getElementById('pu_price').value)||0;
  const sellPriceRaw = document.getElementById('pu_sellprice').value;
  const sellPrice = sellPriceRaw!==''? Number(sellPriceRaw) : null;
  if(!sel){ showToast('পণ্য বাছাই করুন','error'); return; }
  if(sel==='__new__'){
    const name = document.getElementById('pu_new_name').value.trim();
    if(!name){ showToast('নতুন পণ্যের নাম দিন','error'); return; }
    purchaseItems.push({productId:'__new__',name,qty,price,sellPrice,isNew:true});
  } else {
    const p = productById(sel);
    purchaseItems.push({productId:sel,name:p.name,qty,price,sellPrice});
  }
  refreshPurchaseModal();
}
function completePurchase(){
  const supplier = document.getElementById('pu_supplier').value.trim();
  const paid = Number(document.getElementById('pu_paid').value)||0;
  const total = purchaseItems.reduce((a,i)=>a+i.qty*i.price,0);
  const due = Math.max(0,total-paid);
  const now = new Date().toISOString();

  purchaseItems.forEach(it=>{
    if(it.isNew){
      const sp = it.sellPrice && it.sellPrice>0 ? it.sellPrice : Math.round(it.price*1.15);
      const np = {id:newId('p'),name:it.name,categoryId:state.categories[0]?.id||'',sku:'SKU-'+(uid++),barcode:'',purchasePrice:it.price,sellingPrice:sp,stock:0,minStock:5,unit:'পিস',batches:[]};
      addStockBatch(np,it.qty,it.price,now);
      state.products.push(np);
      it.productId = np.id;
    } else {
      const p = productById(it.productId);
      if(p){
        addStockBatch(p,it.qty,it.price,now);
        if(it.sellPrice && it.sellPrice>0){ p.sellingPrice = it.sellPrice; }
        checkStockNotify(p);
      }
    }
  });

  const purchase = {id:newId('pu'),date:now,supplier,items:purchaseItems.slice(),total,paid,due};
  state.purchases.push(purchase);
  addHistory('purchase', 'ক্রয় সম্পন্ন'+(supplier?' — '+supplier:''), total, purchase.id);
  purchaseItems = [];
  saveState();
  showToast('ক্রয় সফলভাবে সম্পন্ন হয়েছে! নতুন বিক্রয় মূল্য পুরাতন স্টকেও প্রযোজ্য হয়েছে।','success');
  closeModal();
  go('purchase');
}

/* ============ UTILS ============ */
function escapeHtml(str){ return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escapeAttr(str){ return String(str||'').replace(/'/g,"\\'"); }

/* Reset purchaseItems when opening fresh purchase modal */
const _origOpenModal = openModal;
openModal = function(name,arg){
  if(name==='newPurchase') purchaseItems=[];
  _origOpenModal(name,arg);
  if(name==='newPurchase') setTimeout(attachPurchaseListeners,0);
};

/* ============ BOOT ============ */
render(); // shows login screen immediately while auth state resolves
auth.onAuthStateChanged(async (user)=>{
  currentUser = user;
  if(user){
    dataLoaded = false;
    render();
    await loadUserData(user.uid);
    state.view = 'dashboard';
    render();
  } else {
    dataLoaded = false;
    authBusy = false;
    render();
  }
});
</script>
